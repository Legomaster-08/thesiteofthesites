    <script>
        function toggleMenu() {

            navbar.className = navbar.className === "navbar" ?
                               "navbar responsive" : "navbar";
        }

<style>
.navbar {
        overflow: hidden;
        background-color: rgb(2, 1, 61);
    }

    .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
    }

    .navbar a:hover {
        background-color: #091076;
        color: rgb(255, 255, 255);
    }

    .navbar a.icon {
        display: none;
    }

    @media screen and (max-width: 600px) {
        .navbar a:not(:first-child) {
            display: none;
        }

        .navbar a.icon {
            float: right;
            display: block;
        }

        .navbar.responsive {
            position: relative;
        }

        .navbar.responsive a.icon {
            position: absolute;
            right: 0;
            top: 0;
        }

        .navbar.responsive a {
            float: none;
            display: block;
            text-align: left;
        }
      }
  body {
    margin: 0;
    font-family: "JetBrains Mono", monospace;
    color: white;
    text-align: center;
    position: relative;
    min-height: 100vh;
    background-color: rgba(0,0,0,0.35);
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("images/wallpaper.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(8px) saturate(120%);
    transform: scale(1.06);
    z-index: -1;
  }

  h1 {
    margin-top: 0px;
    font-size: 3.5rem;
    font-weight: 700;
    
  }

  p.subtitle {
    margin-top: 10px;
    font-size: 1rem;
    opacity: 0.7;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    padding: 60px;
    max-width: 1400px;
    margin: auto;
  }

  .card {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
  }

  .card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
  }

  .card-content {
    padding: 18px 20px 25px;
    text-align: left;
  }

  .card-title {
    font-size: 1.2rem;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .card-desc {
    font-size: 0.9rem;
    opacity: 0.8;
  }

  footer {
    margin-top: 60px;
    padding-bottom: 90px;
    opacity: 0.8;
    line-height: 1.7em;
  }

  a {
    color: #82b6ff;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
